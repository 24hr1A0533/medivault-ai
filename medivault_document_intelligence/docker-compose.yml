version: "3.8"

services:
  document-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medivault_document_intelligence
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - CHROMA_PERSIST_DIR=/data/chromadb
      - EMBEDDING_MODEL=BAAI/bge-large-en-v1.5
    volumes:
      - chroma_data:/data/chromadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/doc-intelligence/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  chroma_data:
    driver: local
