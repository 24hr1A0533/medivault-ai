apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medivault-vllm-hpa
  namespace: medivault-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medivault-vllm-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
