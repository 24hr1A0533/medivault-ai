name: MediVault AI Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  test-and-lint:
    name: Backend Pytest & Frontend Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8 httpx

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest tests/ --maxfail=1 --disable-warnings -v

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: medivault-ai/frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: medivault-ai/frontend
        run: |
          npm ci
          npm run build

  security-scan:
    name: SAST, Secret Scanning & Dependency Audit
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

  docker-build:
    name: Build & Verify Production Container Images
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-docker-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: medivault/api:${{ github.sha }}

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./medivault-ai/frontend
          file: ./medivault-ai/frontend/Dockerfile
          push: false
          tags: medivault/frontend:${{ github.sha }}

  deploy-production:
    name: GitOps Deployment with Automated Rollback
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f infra/kubernetes/deployment.yaml
          kubectl apply --dry-run=client -f infra/kubernetes/configmap.yaml
          kubectl apply --dry-run=client -f infra/kubernetes/secrets.yaml
