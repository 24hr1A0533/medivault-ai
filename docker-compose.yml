version: "3.8"

services:
  # 1. Edge Ingress Nginx Reverse Proxy
  nginx-edge:
    image: nginx:1.25-alpine
    container_name: medivault-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - medivault-api
      - medivault-frontend
    networks:
      - medivault-net

  # 2. Frontend React Web Application
  medivault-frontend:
    build:
      context: ./medivault-ai/frontend
      dockerfile: Dockerfile
    container_name: medivault-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - medivault-api
    networks:
      - medivault-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Core Backend API & EHR Gateway
  medivault-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: medivault-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://medivault_admin:secret_pass_2026@postgres-db:5432/medivault_prod
      - REDIS_URL=redis://redis-cache:6379/0
      - QDRANT_URL=http://qdrant-db:6333
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker:9092
      - SECRET_KEY=medivault_enterprise_secret_key_at_least_64_characters_long_for_security_compliance_2026
      - ALLOW_SIMULATED_AUTH=false
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      qdrant-db:
        condition: service_healthy
    networks:
      - medivault-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. MLLP HL7 Listener (Port 2575)
  mllp-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.hl7
    container_name: medivault-hl7-mllp
    ports:
      - "2575:2575"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker:9092
    depends_on:
      - kafka-broker
    networks:
      - medivault-net

  # 5. PostgreSQL 16 with Row-Level Security
  postgres-db:
    image: postgres:16-alpine
    container_name: medivault-postgres
    environment:
      - POSTGRES_USER=medivault_admin
      - POSTGRES_PASSWORD=secret_pass_2026
      - POSTGRES_DB=medivault_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - medivault-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medivault_admin -d medivault_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 6. In-Memory Cache (Sub-2s Emergency Case File)
  redis-cache:
    image: redis:7.2-alpine
    container_name: medivault-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - medivault-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 7. Qdrant Vector Database
  qdrant-db:
    image: qdrant/qdrant:v1.7.4
    container_name: medivault-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - medivault-net
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep -q 18BD || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 8. Event Fabric Broker (Kafka KRaft)
  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: medivault-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-broker:29093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - CLUSTER_ID=4L62EnnTQNmnVDHbwh=
    networks:
      - medivault-net

  # 9. Metrics & Observability (Prometheus)
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: medivault-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - medivault-net

  # 10. Grafana Dashboards
  grafana:
    image: grafana/grafana:10.1.0
    container_name: medivault-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_secret_2026
    volumes:
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - medivault-net

volumes:
  pgdata:
  redisdata:
  qdrantdata:

networks:
  medivault-net:
    driver: bridge
