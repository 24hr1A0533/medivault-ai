# MediVault Commercial Hospital Operating System
# Master Alembic Database Migration Configuration

[alembic]
script_location = medivault-ai/backend/alembic
version_path_separator = os
output_encoding = utf-8
sqlalchemy.url = postgresql+asyncpg://medivault_admin:secret_pass_2026@localhost:5432/medivault_prod

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
