;; MediVault AI Enterprise PgBouncer Configuration
;; Configured for High-Throughput Transaction Pooling in Hospital Production

[databases]
medivault_prod = host=postgres-db port=5432 dbname=medivault_prod auth_user=medivault_admin

[pgbouncer]
;; Administrative settings
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

;; Network settings
listen_addr = *
listen_port = 6432

;; Authentication settings
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Connection pool settings
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 20
reserve_pool_timeout = 5.0
max_db_connections = 200

;; Performance & Connection timeouts
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = SELECT 1
server_lifetime = 3600
server_idle_timeout = 600
client_idle_timeout = 300
query_timeout = 60
idle_transaction_timeout = 120

;; Low-latency TCP Tuning
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 30
tcp_keepintvl = 10
