events {
    worker_connections 10240;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting zone (50 req/s per IP burst to 100)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=50r/s;

    upstream backend_cluster {
        server medivault-api:8000;
        keepalive 64;
    }

    server {
        listen 80;
        server_name api.medivault.health fhir.medivault.health;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location /health {
            return 200 '{"status":"UP","cluster":"primary-east"}';
            add_header Content-Type application/json;
        }

        location / {
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
