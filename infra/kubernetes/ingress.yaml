apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medivault-ingress
  namespace: medivault-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  tls:
    - hosts:
        - hospital.medivault.health
        - api.medivault.health
        - fhir.medivault.health
      secretName: medivault-tls-certs
  rules:
    # 1. Frontend Web Portals
    - host: hospital.medivault.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medivault-frontend-service
                port:
                  number: 80

    # 2. Backend Enterprise API Gateway & EHR
    - host: api.medivault.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medivault-api-service
                port:
                  number: 80

    # 3. Direct FHIR R4 & SMART Server
    - host: fhir.medivault.health
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medivault-api-service
                port:
                  number: 80
