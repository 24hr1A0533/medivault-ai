apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medivault-api-hpa
  namespace: medivault-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medivault-api-deployment
  minReplicas: 5
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medivault-frontend-hpa
  namespace: medivault-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: medivault-frontend-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
