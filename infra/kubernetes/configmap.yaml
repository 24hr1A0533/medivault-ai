apiVersion: v1
kind: ConfigMap
metadata:
  name: medivault-config
  namespace: medivault-production
  labels:
    app.kubernetes.io/name: medivault-config
    app.kubernetes.io/part-of: medivault-hos
data:
  APP_NAME: "MediVault Commercial Hospital Operating System"
  ENVIRONMENT: "production"
  DEBUG: "false"
  PORT: "8000"
  ALLOWED_ORIGINS: "https://hospital.medivault.health,https://console.medivault.health,https://ambulance.medivault.health"
  DATABASE_POOL_SIZE: "50"
  DATABASE_MAX_OVERFLOW: "100"
  DATABASE_POOL_PRE_PING: "true"
  DATABASE_POOL_RECYCLE: "1800"
  ALLOW_SIMULATED_AUTH: "false"
  EXTRACTION_ENABLED: "true"
  AUDIT_LOG_RETENTION_DAYS: "2555"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap.medivault-production.svc.cluster.local:9092"
  REDIS_URL: "redis://:medivault_redis_sec@redis-master.medivault-production.svc.cluster.local:6379/0"
