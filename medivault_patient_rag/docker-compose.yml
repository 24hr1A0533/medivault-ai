version: "3.8"

services:
  patient-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medivault_patient_rag
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - VECTOR_STORE_DIR=/data/patient_rag_chroma
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - patient_rag_data:/data/patient_rag_chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/patient-rag/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  patient_rag_data:
    driver: local
